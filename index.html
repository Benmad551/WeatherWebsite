<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
<input id="cityInput" type="search" placeholder="Search city, e.g. Louisville, KY, US">
    <div id="weather">

        <p id="temp"></p>
        <p id="feelsLike"></p>
        <p id="humidity"></p>
        <p id="description"></p>
        <p id="windSpeed"></p>
        <img id="icon" src="" alt="Weather Icon">
    </div>
</body>

<script src="script.js"></script>
</html>
